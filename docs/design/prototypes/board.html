<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boardtalk Live Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: full-window board (dotted plane, ink without boxes) with a transcript panel on the right.
   build.py inlines the font for the self-contained Artifact copy.
   Deliberately one light look, like the board it follows. Values from docs/design/board-ui.md. */
@font-face { font-family: "Virgil"; src: url("fonts/Virgil-Regular.woff2") format("woff2"); font-display: block; }
:root {
  color-scheme: light;
  --plane: #FCFCFC; --dot: #D4D4D4; --ink: #262626; --title: #6741D9; --marker: rgba(254, 243, 199, .78);
  --hl: rgba(254, 243, 199, .62); --red: #C2410C; --pencil: #A3A3A3;
  --chrome: #FFFFFF; --chrome-line: #ECECEC; --ui: #1F1F1F; --ui-muted: #9A9A9A; --ui-soft: #525252; --bubble: #EEF1F8;
  --ptr-fill: #FDE68A; --ptr-stroke: #B45309;
  --f-hand: "Virgil", "Segoe Print", "Comic Sans MS", cursive;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body { background: var(--plane); color: var(--ui); font: 14px/1.5 var(--f-ui); overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--title); outline-offset: 2px; }

.app { height: 100%; display: flex; }
.board {
  position: relative; flex: 1; min-width: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--plane);
  background-image: radial-gradient(circle, var(--dot) .55px, transparent 1.2px);
}
.board.dragging { cursor: grabbing; }
.page { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.page.leaving { transition: opacity .5s ease, translate .5s ease; opacity: 0; translate: -40px 0; }
.page.entering { animation: page-in .55s ease both; }
@keyframes page-in { from { opacity: 0; translate: 40px 0; } }

/* ---- floating chrome ---- */
.float { position: absolute; z-index: 20; display: flex; align-items: center; gap: 4px; }
.tl { top: max(14px, env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); }
.tc { top: max(14px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); }
.bl { bottom: max(14px, env(safe-area-inset-bottom, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); }
.chip {
  display: flex; align-items: center; gap: 2px; height: 34px; padding: 0 4px; border-radius: 999px;
  background: var(--chrome); border: 1px solid var(--chrome-line); box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.icon-btn { width: 30px; height: 28px; border: 0; background: none; border-radius: 999px; display: grid; place-items: center; cursor: pointer; color: var(--ui-soft); }
.icon-btn:hover { background: #F4F4F5; color: var(--ui); }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.icon-btn[aria-pressed="true"] { color: var(--title); background: #F1EDFD; }
.icon-btn svg { width: 16px; height: 16px; }
.pill { padding: 0 12px 0 14px; gap: 8px; font-weight: 600; font-size: 13px; }
.pill .live { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; font-size: 12px; color: #15803D; }
.pill .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: live 1.6s ease-in-out infinite; }
.pill .live.ended { color: var(--ui-muted); }
.pill .live.ended::before { animation: none; }
@keyframes live { 50% { opacity: .35; } }
.num { font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 42px; text-align: center; color: var(--ui-soft); }
.sep { width: 1px; height: 16px; background: var(--chrome-line); margin: 0 4px; }

/* ---- caption ---- */
.caption {
  position: absolute; z-index: 15; left: 50%; transform: translateX(-50%);
  bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 12px)); width: min(640px, calc(100% - 140px));
  text-align: center; pointer-events: none; font: 500 16px/1.7 var(--f-ui); color: var(--ui);
}
.caption .box { display: inline; padding: 6px 14px; border-radius: 14px; background: rgba(250,250,250,.86); backdrop-filter: blur(2px); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.caption .box:empty { display: none; }
.caption .fresh { animation: cap-in .6s ease-out both; }
.caption .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; background: #888; vertical-align: -.15em; animation: blink 1s step-end infinite; }
@keyframes cap-in { from { opacity: 0; filter: blur(2px); } }
@keyframes blink { 50% { opacity: 0; } }

/* ---- ink on the plane ---- */
.card { position: absolute; width: 360px; padding: 0 10px 3px; font: 16px/1.5 var(--f-hand); color: var(--ink); }
.card .head { position: relative; text-align: center; margin-bottom: 2px; }
.card .no { position: absolute; left: 0; top: 5px; font: 12px/1 var(--f-ui); color: var(--pencil); letter-spacing: .02em; }
.card .title {
  display: inline; padding: 0 2px; font-size: 19.6px; line-height: 1.4; color: var(--title); border-radius: 2px;
  background: linear-gradient(transparent 55%, var(--marker) 55%) no-repeat; background-size: 0% 100%;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.card.k-error .title { color: var(--red); }
.card .title.swiped { background-size: 100% 100%; }
.card .title.swipe { animation: swipe .42s ease both; }
@keyframes swipe { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
.card .body { position: relative; z-index: 1; }
.card .body p { margin: .2em 0; overflow-wrap: anywhere; }
.card .body ul { margin: 0; padding-left: 1.25em; }
.card .body li { margin: .25em 0; overflow-wrap: anywhere; }
.card .body strong { font-weight: 400; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.card code { font: inherit; background: rgba(0,0,0,.055); border-radius: 4px; padding: 0 .25em; }
.card code.unv { background: none; text-decoration: underline dotted var(--red); text-underline-offset: 4px; }
.card .unv-tag { font: 11px var(--f-ui); color: var(--red); margin-left: 4px; letter-spacing: .03em; }
.card svg.ann { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.card svg.ann.under { z-index: 0; }
.card svg.ann.over { z-index: 2; }
.card .note { position: absolute; font: 15px var(--f-hand); color: var(--red); white-space: nowrap; transform: rotate(-3deg); }
.card.replaced .head, .card.replaced .body { opacity: .55; }
.card.writing code:not(.lit) { background: none; }
.card.writing li:not(.lit)::marker { color: transparent; }
.card.writing strong:not(.lit) { text-decoration-color: transparent; }
.c { opacity: 0; }
.c.on { animation: dissolve .36s ease both; }
@keyframes dissolve { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }
.pending { position: absolute; width: 360px; padding: 4px 10px; font: 16px/1.5 var(--f-hand); color: var(--pencil); transition: opacity .25s ease; }
.pending .lbl { overflow-wrap: anywhere; }
.pending .t { font: 12px var(--f-ui); color: var(--pencil); font-variant-numeric: tabular-nums; margin-left: 6px; }
.pending .scan { display: block; height: 2px; margin-top: 4px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--pencil), transparent) no-repeat; background-size: 40% 100%; animation: scan 1.3s linear infinite; opacity: .6; }
@keyframes scan { from { background-position: -60% 0; } to { background-position: 160% 0; } }
.pointer { position: absolute; left: 0; top: 0; z-index: 30; pointer-events: none; opacity: 0; transition: opacity .38s; }
.pointer.show { opacity: 1; }
.pointer .tap { display: block; transform-origin: 0 0; }
.pointer.tapping .tap { animation: tap .42s cubic-bezier(.22,1,.36,1) both; }
.pointer .rest { display: block; transform-origin: 0 0; animation: rest 2.4s ease-in-out infinite; }
@keyframes tap { 0% { transform: translate(6px,3px) scale(.94); } 55% { transform: translate(-1.2px,-.6px) scale(1.02); } 100% { transform: none; } }
@keyframes rest { 50% { transform: translate(1.4px,.7px); } }

/* ---- transcript panel ---- */
.panel { width: 380px; flex: none; display: flex; flex-direction: column; background: var(--chrome); border-left: 1px solid var(--chrome-line); }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 16px 18px 10px; font-weight: 600; font-size: 13.5px; }
.panel-head svg { width: 15px; height: 15px; color: var(--ui-soft); }
.panel-head .grow { flex: 1; }
.log { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; line-height: 1.55; }
.log .say { color: var(--ui); }
.log .say.old { color: var(--ui-muted); }
.log .user { align-self: flex-end; max-width: 82%; background: var(--bubble); border-radius: 14px; padding: 9px 13px; color: var(--ui); }
.mk { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; color: var(--ui-muted); background: none; border: 0; padding: 1px 0; text-align: left; cursor: pointer; letter-spacing: .01em; }
.mk:hover { color: var(--ui-soft); }
.mk svg { width: 12px; height: 12px; flex: none; }
.mk span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk .code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
.mk .spin { width: 10px; height: 10px; border: 1.5px solid var(--chrome-line); border-top-color: var(--ui-muted); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.status { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ui-muted); }
.status .dots { display: inline-flex; gap: 2px; }
.status .dots i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; animation: dot 1.2s ease-in-out infinite; }
.status .dots i:nth-child(2) { animation-delay: .15s; } .status .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { opacity: .2; } }
.replay { margin: 0 12px max(12px, env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border: 1px solid var(--chrome-line); border-radius: 14px; }
.replay .lbl { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ui-muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.replay select { border: 1px solid var(--chrome-line); background: #fff; border-radius: 8px; font-size: 12px; padding: 3px 4px; color: var(--ui-soft); }
.panel-toggle { display: none; }
@media (max-width: 900px) {
  .panel { position: absolute; z-index: 40; right: 0; top: 0; bottom: 0; width: min(380px, 92vw); transform: translateX(100%); transition: transform .3s ease; }
  .app.panel-open .panel { transform: none; box-shadow: -12px 0 30px -18px rgba(0,0,0,.3); }
  .panel-toggle { display: grid; }
  .tc .zoom-group { display: none; }
  .tc { left: auto; right: max(14px, env(safe-area-inset-right, 0px)); transform: none; }
  .caption { width: calc(100% - 32px); bottom: 64px; font-size: 15px; }
}
@media (max-width: 520px) { .tl .pill { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-12%" y="-12%" width="124%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/></filter>
  </defs>
</svg>

<div class="app" id="app">
  <main class="board" id="board" aria-label="Session board">
    <div class="float tl">
      <button class="chip icon-btn" style="width:34px;padding:0" aria-label="Show the whole page" title="Show the whole page" id="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
      <div class="chip pill"><span class="ttl">Fix DAS crash on empty lists</span><span class="live" id="live">live</span></div>
    </div>
    <div class="float tc">
      <div class="chip">
        <span class="zoom-group" style="display:contents">
          <button class="icon-btn" id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <span class="num" id="zoomLbl">100%</span>
          <button class="icon-btn" id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <span class="sep"></span>
        </span>
        <button class="icon-btn" id="prevPage" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span class="num" id="pageLbl">1 / 1</span>
        <button class="icon-btn" id="nextPage" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <span class="sep"></span>
        <button class="icon-btn panel-toggle" id="panelToggle" aria-label="Show transcript"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H8l-4 4z"/></svg></button>
      </div>
    </div>
    <div class="float bl">
      <button class="chip icon-btn" style="width:34px;padding:0" id="follow" aria-pressed="true" aria-label="Follow the agent" title="Follow the agent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
    <div class="caption" id="caption" aria-live="polite"><span class="box" id="capBox"></span></div>
  </main>

  <aside class="panel" aria-label="Transcript">
    <div class="panel-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H8l-4 4z"/></svg>
      <span class="grow">Session</span>
      <button class="icon-btn panel-toggle" id="panelClose" aria-label="Hide transcript"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="log" id="log"></div>
    <div class="replay">
      <span class="lbl" id="replayLbl">Replay of a recorded pi session</span>
      <select id="speed" aria-label="Replay speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select>
      <button class="icon-btn" id="restart" aria-label="Replay from the start" title="Replay from the start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="icon-btn" id="toEnd" aria-label="Show the final board" title="Show the final board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg></button>
      <button class="icon-btn" id="play" aria-label="Pause" title="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    </div>
  </aside>
</div>

<script>
(() => {
  // ---------- the recorded session (what the scribe produced, in order) ----------
  const TASK = "The DAS response crashes with IndexError when an attribute holds an empty list. Make build_attributes handle empty and nested lists, and add a regression test.";
  const STEPS = [
    { user: TASK },
    { say: "I'll start by finding where the DAS attributes are written.",
      card: { id: 0, kind: "goal", title: "Task", body: "Fix the `IndexError` when an attribute holds an empty list.\n- make `build_attributes` handle empty and nested lists\n- add a regression test" } },
    { tool: { label: "bash · grep -rn build_attributes src/", ms: 2600 },
      card: { id: 1, kind: "observation", title: "One writer, in das.py", body: "- defined once: `src/pydap/responses/das.py:41`\n- called from `DASResponse.__iter__`" },
      ann: [{ type: "hl", card: 0, text: "build_attributes" }] },
    { say: "Reading the writer to see how it picks a type.",
      tool: { label: "read · src/pydap/responses/das.py", ms: 2800 },
      card: { id: 2, kind: "observation", title: "The list branch reads values[0]", body: "It types the attribute by its first element:\n`type_ = get_type(values[0])`\nSo an **empty list** raises." },
      ann: [{ type: "circle", card: 2, text: "type_ = get_type(values[0])" }] },
    { say: "Simplest fix first: guard the empty case.",
      card: { id: 3, kind: "decision", title: "Guard the empty case", body: "Return an empty `String` attribute when the list is empty." } },
    { tool: { label: "edit · src/pydap/responses/das.py (+3 −1)", ms: 2400 },
      card: { id: 4, kind: "action", title: "Added an early return", body: "`if not values:` returns `String \"\"`" } },
    { say: "Running the DAS tests.",
      tool: { label: "bash · pytest tests/test_das.py -q", ms: 3200 },
      card: { id: 5, kind: "error", title: "Nested lists still fail", body: "1 failed, 13 passed\n`IndexError: list index out of range`\nin `test_nested_empty`", unverified: ["test_nested_empty"] },
      ann: [{ type: "circle", card: 5, text: "IndexError: list index out of range" }, { type: "hl", card: 4, text: "if not values:" }] },
    { say: "The guard misses [[]]. I'll type by the first leaf instead.",
      card: { id: 6, kind: "decision", title: "Type by the first leaf", body: "Walk nested lists to the first scalar.\nEmpty at any depth means `String`.", supersedes: 3 } },
    { tool: { label: "edit · src/pydap/responses/das.py (+9 −3)", ms: 2600 },
      card: { id: 7, kind: "action", title: "Added _first_leaf()", body: "Replaces the early return:\n`_first_leaf(values)`" } },
    { say: "Running the whole suite.",
      tool: { label: "bash · pytest -q", ms: 3000 },
      card: { id: 8, kind: "state", title: "All tests pass", body: "`14 passed in 0.82s`\nRegression tests cover `[]` and `[[]]`." },
      ann: [{ type: "hl", card: 0, text: "add a regression test" }] },
    { say: "Page one is full, so I'm folding it into a handoff card.",
      fold: { id: 9, kind: "handoff", title: "Where we are", body: "- cause: the list branch typed by `values[0]` (#2)\n- fix: `_first_leaf` (#7); tests green (#8)\n- open: is `[[]]` a String or a Container?" } },
    { tool: { label: "bash · git diff --stat", ms: 2200 },
      card: { id: 10, kind: "observation", title: "The change is small", body: "- `src/pydap/responses/das.py | 14 +++++---`\n- `tests/test_das.py | 22 ++++++`" } },
    { say: "Done. One question for you: should [[]] be typed as String or as a Container?",
      card: { id: 11, kind: "handoff", title: "Ready for review", body: "`build_attributes` now types by the first leaf.\nOpen question: `[[]]` as String or Container?" },
      ann: [{ type: "hl", card: 9, text: "is `[[]]` a String or a Container?" }] },
  ];

  // ---------- geometry ----------
  const COL_W = 360, GUTTER = 25, X0 = 36, Y0 = 70, COL_MAX = 600, GAP = 16, CAPTION_ROOM = 120;
  const colX = (i) => X0 + i * (COL_W + GUTTER);

  const $ = (s) => document.querySelector(s);
  const board = $("#board"), log = $("#log"), capBox = $("#capBox");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- sim clock: pause and speed apply to every animation the script drives ----------
  let simNow = 0, speed = 1, playing = true, GEN = 0;
  const waiters = [];
  const ABORT = Symbol("abort");
  function wait(S, ms) {
    if (!S.anim) return S.gen === GEN ? Promise.resolve() : Promise.reject(ABORT);
    return new Promise((res, rej) => waiters.push({ at: simNow + ms, res: () => (S.gen === GEN ? res() : rej(ABORT)) }));
  }
  async function tween(S, ms, fn) {
    if (!S.anim) return fn(1);
    const start = simNow;
    for (;;) { const p = Math.min(1, (simNow - start) / ms); fn(p); if (p >= 1) return; await wait(S, 1); }
  }
  const ease = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);

  // ---------- board state ----------
  let pages = [], cur = 0, cards = new Map(), cam = { x: 0, y: 0, s: 1 }, follow = true, pointer;
  function newPage() {
    const el = document.createElement("div"); el.className = "page";
    const p = { el, cols: [0, 1, 2].map((i) => ({ x: colX(i), nextY: Y0 })), active: 0 };
    pages.push(p); return p;
  }
  function showPage(i, anim) {
    const old = pages[cur]?.el; cur = i;
    const el = pages[i].el;
    if (old && old !== el) {
      if (anim) { old.classList.add("leaving"); setTimeout(() => { old.remove(); old.classList.remove("leaving"); }, 500); } else old.remove();
    }
    if (!el.isConnected) { board.insertBefore(el, board.firstChild); if (anim) { el.classList.add("entering"); setTimeout(() => el.classList.remove("entering"), 600); } }
    el.append(pointer);
    $("#pageLbl").textContent = `${i + 1} / ${pages.length}`;
    $("#prevPage").disabled = i === 0; $("#nextPage").disabled = i === pages.length - 1;
    applyCam();
  }

  function applyCam() {
    const el = pages[cur]?.el; if (!el) return;

    applyCam();
  }, { passive: false });
  addEventListener("keydown", (e) => { if (e.key === " " && e.target === document.body) { e.preventDefault(); setPlaying(!playing); } });

  // ---------- frame loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, now - last); last = now;
    if (playing) {
      simNow += dt * speed;
      for (let i = waiters.length - 1; i >= 0; i--) if (waiters[i].at <= simNow) { const w = waiters.splice(i, 1)[0]; w.res(); }
      document.querySelectorAll(".pending .t").forEach((t) => { t.textContent = ((simNow - +t.dataset.start) / 1000).toFixed(1) + " s"; });
    }
    document.getAnimations().forEach((a) => { if (a.playbackRate !== speed) a.playbackRate = speed; if (playing ? a.playState === "paused" : a.playState === "running") playing ? a.play() : a.pause(); });
    $("#replayLbl").textContent = `Replay of a recorded pi session · ${(simNow / 1000).toFixed(0)} s`;
    requestAnimationFrame(frame);
  }
  const start = () => { cam.s = board.clientWidth < 700 ? .8 : 1; run(true); requestAnimationFrame(frame); };
  (document.fonts?.load ? document.fonts.load('16px "Virgil"') : Promise.resolve()).finally(start);
})();
</script>
