name: Bug report
description: Something in boardtalk does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Do not paste session files or logs that may contain secrets.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions (boardtalk, pi, Node, OS)
